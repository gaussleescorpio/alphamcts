seed: 42
data:
  source: synthetic
  n_stocks: 100
  n_days: 1200
  csv_dir: null
  train_ratio: 0.7
  horizon: 10
window_range:
- 2
- 60
mcts:
  exploration_weight: 1.0
  initial_budget: 3
  budget_increment: 1
  max_budget: 6
  dimension_temperature: 1.0
  e_max: 1.0
  max_correction_attempts: 3
mining:
  n_trees: 3
  target_zoo_size: 8
zoo:
  min_rank_ic: 0.015
  min_rank_ir: 0.3
  max_turnover: 1.6
  max_correlation: 0.8
  max_rel_rank: 0.95
fsa:
  top_k: 3
  min_support: 0.3
  min_alphas: 5
evaluation:
  top_frac: 0.1
llm:
  backend: cursor
  model: composer-2.5
  few_shot_k: 1
  correlation_filter_eta: 0.5
  temperature_generate: 1.0
  temperature_correct: 0.8
  temperature_overfit: 0.1
combiner:
  alpha_set_sizes:
  - 10
  models:
  - lightgbm
  - mlp
  lightgbm:
    num_leaves: 32
    n_estimators: 200
    max_depth: 8
    learning_rate: 0.05
    reg_alpha: 0.1
    reg_lambda: 0.1
  mlp:
    hidden:
    - 256
    - 128
    - 64
    dropout: 0.3
    lr: 0.001
    batch_size: 1024
    max_epochs: 50
    patience: 5
backtest:
  top_frac: 0.1
  cost: 0.0015
