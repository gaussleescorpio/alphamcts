[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphamcts"
version = "0.1.0"
description = "Replication of 'Navigating the Alpha Jungle: An LLM-Powered MCTS Framework for Formulaic Alpha Factor Mining' (AAAI-26)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
llm = ["cursor-sdk"]
torch = ["torch"]
dev = ["pytest>=7"]

[project.scripts]
alphamcts = "alphamcts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
